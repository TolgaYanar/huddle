name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must satisfy the root engines field and Prisma 7's supported lines.
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check-types

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # next build only needs the rewrite target to be a parseable URL.
          API_PROXY_TARGET: http://localhost:4000

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory only: the Prisma CLI chain (@prisma/config -> deepmerge-ts/effect/defu)
    # currently has open high advisories with no fix on the 6.x line. Flip this to a
    # blocking job once that is resolved, e.g. by upgrading to Prisma 7.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - run: npm ci

      # Fails the job on a new high/critical advisory in runtime dependencies.
      # Dev-only tooling advisories are reported by the step above but do not block.
      # Reported, never blocking: `continue-on-error` still surfaces a red X on
      # the PR, which trains people to ignore it. Print the report and exit 0.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high || true
