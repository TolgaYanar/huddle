name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # The attribution check reads the complete PR commit range.
          fetch-depth: 0

      # The guard's own failure mode is silent, so it is exercised on every run
      # rather than trusted.
      - name: Self-test the attribution guard
        run: bash scripts/check-ai-coauthors.sh --self-test

      - name: Reject unapproved AI co-author trailers
        if: github.event_name == 'pull_request'
        env:
          AI_COAUTHOR_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'allow-ai-coauthor') }}
        run: >-
          bash scripts/check-ai-coauthors.sh --range
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          # Must satisfy the root engines field and Prisma 7's supported lines.
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # macOS iCloud duplicates ("name 2.ext") are not gitignored, because a
      # "* 2.*" pattern also hides legitimate names like "docs/OAuth 2.md".
      # They are rejected here instead, where the failure is visible.
      - name: Reject macOS FileProvider duplicates
        run: npm run check-duplicates

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check-types

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # next build only needs the rewrite target to be a parseable URL.
          API_PROXY_TARGET: http://localhost:4000

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory only. The remaining runtime advisories are Prisma 7's CLI chain
    # (prisma -> @prisma/config -> deepmerge-ts), which pins an exact vulnerable
    # deepmerge-ts and has no published fix; npm overrides do not take. They are
    # reachable only when the CLI runs (generate / migrate), never on the request
    # path. Make this blocking once Prisma ships a fix and the report is empty.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - run: npm ci

      # Prints the report and always exits 0. `continue-on-error` was not enough:
      # it still paints a red X on the PR, which trains people to ignore it.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high || true
